<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Entry</title>
    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="./css/product-entry.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="logo-graal-sidebar">
                <img src="/images/logo_preto.png" alt="Graal">
            </div>
            <nav>
                <ul>
                    <a href="/deposit">
                        <li class="nav-item">
                            <ion-icon name="document-text-outline"></ion-icon>
                            <span>Requests</span>
                        </li>
                    </a>
                    <a href="/adm">
                        <li class="nav-item">
                            <ion-icon name="settings-outline"></ion-icon>
                            <span>Admin</span>
                        </li>
                    </a>
                    <a href="/sectors">
                        <li class="nav-item">
                            <ion-icon name="cube-outline"></ion-icon>
                            <span>Sectors</span>
                        </li>
                    </a>
                    <a href="/product-entry">
                        <li class="nav-item selected">
                            <ion-icon name="pricetag-outline"></ion-icon>
                            <span>Products</span>
                        </li>
                    </a>
                    <a href="/reports">
                        <li class="nav-item">
                            <ion-icon name="bar-chart-outline"></ion-icon>
                            <span>Reports</span>
                        </li>
                    </a>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" placeholder="Search...">
                    <button><ion-icon name="search-outline"></ion-icon></button>
                </div>
                <div class="user-profile">
                    <span>Admin</span>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </div>
            </div>

            <div class="content-section">
                <h2>Product Entry</h2>

                <!-- ===== ADD / EDIT FORM ===== -->
                <div class="admin-section">
                    <h3 id="form-title">Add Product</h3>
                    <input type="hidden" id="product-id">
                    <div class="product-form-grid">
                        <div class="input-group">
                            <label for="product-sector-select">Sector <span class="required">*</span></label>
                            <select id="product-sector-select">
                                <option value="">Select a sector...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="product-name">Product Name <span class="required">*</span></label>
                            <input type="text" id="product-name" placeholder="e.g. Steel Drums">
                        </div>
                        <div class="input-group">
                            <label for="product-unit">Unit <span class="required">*</span></label>
                            <input type="text" id="product-unit" placeholder="e.g. kg, boxes, liters">
                        </div>
                        <div class="input-group">
                            <label for="product-quantity">Quantity</label>
                            <input type="number" id="product-quantity" min="0" step="0.01" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label for="product-inventory">Inventory</label>
                            <input type="number" id="product-inventory" min="0" step="0.01" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label for="product-cost">Cost per Unit</label>
                            <input type="number" id="product-cost" min="0" step="0.01" placeholder="0.00">
                        </div>
                        <div class="input-group">
                            <label for="product-supplier">Supplier</label>
                            <input type="text" id="product-supplier" placeholder="e.g. ACME Corp">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" id="clear-form-btn">Clear</button>
                        <button class="btn btn-primary" id="save-product-btn">Save Product</button>
                    </div>
                </div>

                <!-- ===== PRODUCT LIST ===== -->
                <div class="admin-section" style="margin-top: 2rem;">
                    <div class="list-header">
                        <h3>Registered Products</h3>
                        <div class="list-filters">
                            <select id="filter-sector">
                                <option value="">All sectors</option>
                            </select>
                            <input type="text" id="filter-search" placeholder="Search product...">
                        </div>
                    </div>
                    <div class="requisition-table-container">
                        <table class="requisition-table" id="products-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Sector</th>
                                    <th>Name</th>
                                    <th>Unit</th>
                                    <th>Quantity</th>
                                    <th>Inventory</th>
                                    <th>Cost / Unit</th>
                                    <th>Supplier</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="products-tbody"></tbody>
                        </table>
                    </div>
                    <p id="no-products-msg" style="display:none; text-align:center; color:#666; padding:1rem;">No products registered.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CONFIRM DELETE MODAL ===== -->
    <div id="confirm-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Confirmation</h3>
            <p id="confirm-message">Are you sure you want to delete this product?</p>
            <div class="btn-group">
                <button class="btn btn-secondary" id="cancel-delete-btn">Cancel</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- ===== MESSAGE MODAL ===== -->
    <div id="message-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="modal-close" class="modal-close">&times;</span>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button id="modal-ok-btn" class="btn btn-primary">OK</button>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/product-entry.js"></script>
</body>
</html>

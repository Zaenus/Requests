<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sectors</title>
    <link rel="stylesheet" href="./css/products.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="logo-graal-sidebar">
                <img src="/images/logo_preto.png" alt="Graal">
            </div>
            <nav>
                <ul>
                    <a href="/deposit">
                        <li class="nav-item">
                            <ion-icon name="document-text-outline"></ion-icon>
                            <span>Requests</span>
                        </li>
                    </a>
                    <a href="/adm">
                        <li class="nav-item">
                            <ion-icon name="settings-outline"></ion-icon>
                            <span>Admin</span>
                        </li>
                    </a>
                    <a href="/sectors">
                        <li class="nav-item selected">
                            <ion-icon name="cube-outline"></ion-icon>
                            <span>Sectors</span>
                        </li>
                    </a>
                    <a href="/product-entry">
                        <li class="nav-item">
                            <ion-icon name="pricetag-outline"></ion-icon>
                            <span>Products</span>
                        </li>
                    </a>
                    <a href="/reports">
                        <li class="nav-item">
                            <ion-icon name="bar-chart-outline"></ion-icon>
                            <span>Reports</span>
                        </li>
                    </a>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" placeholder="Search...">
                    <button><ion-icon name="search-outline"></ion-icon></button>
                </div>
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40x40.png?text=US" alt="User">
                    <span>Admin</span>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </div>
            </div>

            <div id="products-content" class="content-section" style="display: block;">
                <h2>Sector Management</h2>

                <!-- ===== CREATE SECTOR FORM ===== -->
                <div class="admin-section" style="margin-bottom: 2rem;">
                    <h3>New Sector</h3>
                    <div class="create-sector-row">
                        <div class="input-group" style="flex: 1; margin-bottom: 0;">
                            <label for="new-sector-name">Sector Name <span class="required">*</span></label>
                            <input type="text" id="new-sector-name" placeholder="e.g. IT Department">
                        </div>
                        <button class="btn btn-primary" id="create-sector-btn">Create Sector</button>
                    </div>
                </div>

                <!-- ===== SECTORS LIST ===== -->
                <div class="admin-section" style="width: 100%;">
                    <h3>Registered Sectors</h3>
                    <div id="sectors-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== PRODUCTS VIEW MODAL (read-only) ===== -->
    <div id="products-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modal-title">Sector Products: <span id="selected-sector-name"></span></h3>
            <div id="products-list"></div>
        </div>
    </div>

    <!-- ===== EDIT SECTOR MODAL ===== -->
    <div id="edit-sector-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Edit Sector</h3>
            <div class="edit-form-container">
                <div class="input-group">
                    <label for="edit-sector-name">Sector Name:</label>
                    <input type="text" id="edit-sector-name">
                </div>
                <button class="btn btn-primary" id="save-sector-edit-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- ===== CONFIRM MODAL ===== -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <h3>Confirmation</h3>
            <p id="confirm-message"></p>
            <div class="btn-group">
                <button class="btn btn-secondary" id="cancel-action-btn">Back</button>
                <button class="btn btn-primary" id="confirm-action-btn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ===== SUCCESS MODAL ===== -->
    <div id="success-modal" class="modal">
        <div class="modal-content">
            <h3>Success!</h3>
            <p id="success-message"></p>
            <div class="btn-group" style="justify-content: flex-end;">
                <button class="btn btn-primary" id="success-ok-btn">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/products.js"></script>
</body>
</html>

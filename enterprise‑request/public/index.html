<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Request</title>
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="main-container">
        <div id="form-section" class="form-card">
            <header class="form-header">
                <h1>REQUEST</h1>
                <p>Fill in the fields to request products</p>
            </header>

            <div class="form-fields">
                <div class="field-group">
                    <label for="sector">Sector</label>
                    <select id="sector" required>
                        <option value="">Select sector</option>
                    </select>
                </div>
                <div class="field-group">
                    <label for="date">Date</label>
                    <input type="text" id="date" readonly>
                </div>
                <div class="field-group">
                    <label for="time">Time</label>
                    <input type="text" id="time" readonly>
                </div>
                <div class="field-group">
                    <span>Shift</span>
                    <div class="checkbox-group">
                        <label class="shift-button"><input type="checkbox" name="shift" value="Morning"> Morning</label>
                        <label class="shift-button"><input type="checkbox" name="shift" value="Afternoon"> Afternoon</label>
                        <label class="shift-button"><input type="checkbox" name="shift" value="Night"> Night</label>
                    </div>
                </div>
                <div class="field-group">
                    <label for="employee">Employee</label>
                    <input type="text" id="employee" required>
                </div>
                <div class="field-group">
                    <label for="supervisor">Supervisor</label>
                    <input type="text" id="supervisor" required>
                </div>
            </div>

            <div class="product-search-section">
                <h3>Add Products</h3>
                <div class="category-search-box-row">
                    <div class="field-group-inline">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="field-group-inline">
                        <label for="product-search">Search for a specific product</label>
                        <div class="search-box">
                            <input type="text" id="product-search" placeholder="Search product...">
                            <button id="search-btn">Search</button>
                        </div>
                    </div>
                </div>
                <div id="search-results" class="search-results"></div>
            </div>

            <div class="selected-products-section">
                <h3>Selected Products</h3>
                <ul id="selected-products-list">
                </ul>
            </div>
            
            <div class="field-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" rows="4" placeholder="Add notes here..."></textarea>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btn-confirm">Confirm Request</button>
            </div>
        </div>

        <div id="confirm-section" class="form-card" style="display: none;">
            <header class="form-header">
                <h1>Confirm Details</h1>
                <p>Review the information before submitting</p>
            </header>
            
            <div class="confirm-details">
                <p><strong>Sector:</strong> <span id="confirm-sector"></span></p>
                <p><strong>Shift:</strong> <span id="confirm-shift"></span></p>
                <p><strong>Date:</strong> <span id="confirm-date"></span></p>
                <p><strong>Time:</strong> <span id="confirm-time"></span></p>
                <p><strong>Employee:</strong> <span id="confirm-employee"></span></p>
                <p><strong>Supervisor:</strong> <span id="confirm-supervisor"></span></p>
                
                <h3>Requested Items:</h3>
                <ul id="confirm-products"></ul>

                <div id="confirm-notes-section" style="display: none;">
                    <h3>Notes:</h3>
                    <p id="confirm-notes"></p>
                </div>
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" id="btn-back">Back and Edit</button>
                <button type="button" class="btn btn-primary" id="btn-submit">Submit Request</button>
            </div>
        </div>
        
        <!-- Modal for messages -->
        <div id="modal-message" class="modal" style="display: none;">
            <div class="modal-content">
                <span id="modal-close" class="modal-close">&times;</span>
                <p id="modal-text"></p>
            </div>
        </div>
    </div>
    
    <script src="js/request.js"></script>
</body>
</html>

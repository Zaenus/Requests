<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Autorização</title>
    <link rel="stylesheet" href="./css/autorizacao.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="logo-graal-sidebar">
                <img src="/images/logo_preto.png" alt="Graal">
            </div>
            <nav>
                <ul>
                    <a href="/autorizacao">
                        <li class="nav-item selected">
                            <ion-icon name="document-text-outline"></ion-icon>
                            <span>Autorização</span>
                        </li>
                    </a>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" placeholder="Pesquisar...">
                    <button><ion-icon name="search-outline"></ion-icon></button>
                </div>
                <div class="user-profile">
                    <span id="username-display">Encarregado</span>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </div>
            </div>

            <div id="autorizacao-content" class="content-section">
                <h2>Requisições para Autorizar</h2>
                <div class="requisition-table-container">
                    <table class="requisition-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Setor</th>
                                <th>Data/Hora</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="autorizacao-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="requisicao-details-modal" class="modal-details" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeRequisicaoDetailsModal()">&times;</span>
            <h3 id="modal-title">Detalhes da Requisição <span id="requisition-id-title"></span></h3>
            <div id="requisition-details-container"></div>
            <div class="btn-group" style="justify-content: space-between;">
                <div>
                    <button class="btn btn-secondary" onclick="closeRequisicaoDetailsModal()">Voltar</button>
                    <button class="btn btn-primary" id="edit-items-btn" onclick="toggleEditMode()">Editar Itens</button>
                </div>
                <div class="action-buttons">
                    <button class="btn-action btn-recusar" id="recusar-btn-modal">Recusar</button>
                    <button class="btn-action btn-confirmar" id="aprovar-btn-modal">Aprovar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLoginModal()">&times;</span>
            <h3>Login do Encarregado</h3>
            <div class="login-form-container">
                <div class="input-group">
                    <label for="login-username">Usuário:</label>
                    <input type="text" id="login-username">
                </div>
                <div class="input-group">
                    <label for="login-password">Senha:</label>
                    <input type="password" id="login-password">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="login-btn">Entrar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="./js/autorizacao.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="logo-graal-sidebar">
                <img src="/images/logo_preto.png" alt="Graal">
            </div>
            <nav>
                <ul>
                    <a href="/deposit">
                        <li class="nav-item">
                            <ion-icon name="document-text-outline"></ion-icon>
                            <span>Requests</span>
                        </li>
                    </a>
                    <a href="/adm">
                        <li class="nav-item selected">
                            <ion-icon name="settings-outline"></ion-icon>
                            <span>Admin</span>
                        </li>
                    </a>
                    <a href="/sectors">
                        <li class="nav-item">
                            <ion-icon name="cube-outline"></ion-icon>
                            <span>Sectors</span>
                        </li>
                    </a>
                    <a href="/product-entry">
                        <li class="nav-item">
                            <ion-icon name="pricetag-outline"></ion-icon>
                            <span>Products</span>
                        </li>
                    </a>
                    <a href="/reports">
                        <li class="nav-item">
                            <ion-icon name="bar-chart-outline"></ion-icon>
                            <span>Reports</span>
                        </li>
                    </a>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" placeholder="Search...">
                    <button><ion-icon name="search-outline"></ion-icon></button>
                </div>
                <div class="user-profile">
                    <span id="username-display">Admin</span>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </div>
            </div>

            <div id="requests-content" class="content-section" style="display: none;">
                <h2>Requests</h2>
            </div>
            
            <div id="admin-content" class="content-section" style="display: block;">
                <h2>Sector and Product Registration</h2>
                <div class="admin-grid">
                    <div class="admin-section">
                        <h3>Add Sector</h3>
                        <div class="input-group">
                            <label for="sector-name">Sector Name:</label>
                            <input type="text" id="sector-name">
                        </div>
                        <button class="btn btn-primary" id="save-sector-btn">Save</button>
                    </div>
                    
                    <div class="admin-section">
                        <h3>Add Products to Stock</h3>
                        <div class="input-group">
                            <label for="product-sector-select">Sector:</label>
                            <select id="product-sector-select">
                                <option value="">Select a sector...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="product-select">Product:</label>
                            <select id="product-select" disabled>
                                <option value="">Select a sector first...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="product-quantity">Quantity to Add:</label>
                            <input type="number" id="product-quantity" min="0" step="0.01" placeholder="0" disabled>
                        </div>
                        <button class="btn btn-primary" id="save-product-btn" disabled>Add to Stock</button>
                        <p style="margin-top:0.75rem; font-size:0.85rem; color:#666;">
                            To register a new product, go to the <a href="/product-entry">Products</a> page.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for success/error messages -->
    <div id="message-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span id="modal-close" class="modal-close">&times;</span>
        <h3 id="modal-title"></h3>
        <p id="modal-message"></p>
        <button id="modal-ok-btn" class="btn btn-primary">OK</button>
    </div>
    </div>
    
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>

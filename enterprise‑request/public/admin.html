<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="logo-graal-sidebar">
                <img src="/images/logo_preto.png" alt="Graal">
            </div>
            <nav>
                <ul>
                    <a href="/deposito">
                        <li class="nav-item">
                            <ion-icon name="document-text-outline"></ion-icon>
                            <span>Requisições</span>
                        </li>
                    </a>
                    <a href="/adm">
                        <li class="nav-item selected">
                            <ion-icon name="settings-outline"></ion-icon>
                            <span>Admin</span>
                        </li>
                    </a>
                    <a href="/setores">
                        <li class="nav-item">
                            <ion-icon name="cube-outline"></ion-icon>
                            <span>Setores</span>
                        </li>
                    </a>
                    <a href="/relatorios">
                        <li class="nav-item">
                            <ion-icon name="bar-chart-outline"></ion-icon>
                            <span>Relatórios</span>
                        </li>
                    </a>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" placeholder="Pesquisar...">
                    <button><ion-icon name="search-outline"></ion-icon></button>
                </div>
                <div class="user-profile">
                    <span>Admin</span>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </div>
            </div>

            <div id="requisicoes-content" class="content-section" style="display: none;">
                <h2>Requisições</h2>
            </div>
            
            <div id="admin-content" class="content-section" style="display: block;">
                <h2>Cadastro de Setores e Produtos</h2>
                <div class="admin-grid">
                    <div class="admin-section">
                        <h3>Cadastrar Setor</h3>
                        <div class="input-group">
                            <label for="sector-name">Nome do Setor:</label>
                            <input type="text" id="sector-name">
                        </div>
                        <button class="btn btn-primary" id="save-sector-btn">Salvar</button>
                    </div>
                    
                    <div class="admin-section">
                        <h3>Cadastrar Produtos</h3>
                        <div class="input-group">
                            <label for="product-sector-select">Setor:</label>
                            <select id="product-sector-select">
                                <option value="">Selecione um setor...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="product-category">Categoria:</label>
                            <input type="text" id="product-category">
                        </div>
                        <div class="input-group">
                            <label for="product-name">Nome do Produto:</label>
                            <input type="text" id="product-name">
                        </div>
                        <div class="input-group">
                            <label for="product-unit">Unidade:</label>
                            <input type="text" id="product-unit">
                        </div>
                        <button class="btn btn-primary" id="save-product-btn">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for success/error messages -->
    <div id="message-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span id="modal-close" class="modal-close">&times;</span>
        <h3 id="modal-title"></h3>
        <p id="modal-message"></p>
        <button id="modal-ok-btn" class="btn btn-primary">OK</button>
    </div>
    </div>
    
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>
